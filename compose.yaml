version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: supplier_dd_postgres
    environment:
      POSTGRES_DB: supplier_dd_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
