spring:
  application:
    name: supplier-due-diligence-ai

  datasource:
    url: jdbc:postgresql://localhost:5432/supplier_dd_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true

  ai:
    anthropic:
      api-key: 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
      model: claude-3-5-sonnet-20241022

server:
  port: 8080
  servlet:
    context-path: /

app:
  upload:
    dir: ./data/case-documents
    max-file-size: 10MB

abn:
  lookup:
    base-url: https://abr.business.gov.au
    guid: ${ABN_LOOKUP_GUID:}  # Free GUID from abr.business.gov.au registration

supplier:
  verification:
    name-match-threshold: 0.80  # Levenshtein similarity threshold (0.0-1.0)

logging:
  level:
    root: INFO
    com.diligence: DEBUG
