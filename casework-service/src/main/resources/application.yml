spring:
  application:
    name: supplier-due-diligence-ai

  datasource:
    url: jdbc:postgresql://localhost:5432/supplier_dd_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true

server:
  port: 8080
  servlet:
    context-path: /

app:
  upload:
    dir: ./data/case-documents
    max-file-size: 10MB

logging:
  level:
    root: INFO
    com.diligence: DEBUG
