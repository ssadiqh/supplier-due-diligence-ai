spring:
  application:
    name: supplier-due-diligence-ai

  datasource:
    url: jdbc:postgresql://localhost:5432/supplier_dd_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4-turbo
      temperature: 0.0  # Deterministic extraction (no creativity)

server:
  port: 8080
  servlet:
    context-path: /

app:
  upload:
    dir: ./data/case-documents
    max-file-size: 10MB

abn:
  lookup:
    base-url: https://abr.business.gov.au
    guid: ${ABN_LOOKUP_GUID:}  # Free GUID from abr.business.gov.au registration

logging:
  level:
    root: INFO
    com.diligence: DEBUG
